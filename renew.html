<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>APX Trial / Renew</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  background:radial-gradient(circle,#2b1d0e,#0b0702);
  color:#ffd36a;font-family:Segoe UI;padding:20px;
}
.box{
  max-width:400px;margin:auto;
  background:#120c05;border:1px solid #a77b2e;
  padding:20px;border-radius:16px;
}
input,button{
  width:100%;padding:12px;margin-top:12px;
  border-radius:10px;border:none;
}
input{background:#1b1207;color:#fff}
button{
  background:linear-gradient(90deg,#ffd36a,#ffae00);
  font-weight:bold;cursor:pointer;
}
.paid{background:linear-gradient(90deg,#22c55e,#16a34a);color:#000}
</style>
</head>
<body>

<div class="box">
  <h2>🚀 Get 10-Day Trial</h2>
  <input id="user" placeholder="Create Username">
  <input id="tg" placeholder="Telegram @username">
  <button onclick="trial()">Request Trial</button>

  <hr style="margin:20px 0;border-color:#a77b2e">

  <button class="paid" onclick="buy()">💎 Buy Premium – $10</button>
</div>

<audio id="successSound">
  <source src="success.mp3" type="audio/mpeg">
</audio>

<script>
const TRIAL_API="https://live.mkapi009.workers.dev/request-trial";

async function trial(){
  if(!user.value||!tg.value){alert("Fill all fields");return;}
  await fetch(TRIAL_API,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({username:user.value,telegram:tg.value})
  });
  document.getElementById("successSound").play(); // RENEW SUCCESS SOUND
  alert("Request sent. Admin will contact you on Telegram.");
}

function buy(){
  window.open("https://t.me/MMQUOBOT","_blank"); // Paid plan → Telegram
}
</script>
</body>
</html>
