<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>APX Premium – Trial / Renew</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{background:#0b0f1a;color:#fff;font-family:Arial;padding:20px}
    .card{background:#12172b;border-radius:16px;padding:18px;max-width:420px;margin:auto}
    input,button{width:100%;padding:12px;border-radius:10px;border:none;margin-top:12px}
    input{background:#0f1430;color:#fff}
    button{background:#f5c542;color:#000;font-weight:bold;cursor:pointer}
    small{color:#9aa3c7}
  </style>
</head>
<body>

<div class="card">
  <h2>🚀 APX Premium Access</h2>
  <small>Create username and request your 10-day trial.</small>

  <input id="username" placeholder="Create Username">
  <input id="telegram" placeholder="Telegram Username (e.g. @name)">

  <button onclick="requestTrial()">Get 10-Day Trial</button>
</div>

<script>
const WORKER_URL = "https://live.mkapi009.workers.dev";

async function requestTrial(){
  const u = document.getElementById("username").value.trim();
  const t = document.getElementById("telegram").value.trim();

  if(!u || !t){
    alert("Please fill all fields");
    return;
  }

  try{
    await fetch(`${WORKER_URL}/request-trial`,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        username: u,
        telegram: t
      })
    });

    alert("Request sent. Admin will contact you on Telegram.");

  }catch(e){
    alert("Network error. Try again.");
  }
}
</script>

</body>
</html>
