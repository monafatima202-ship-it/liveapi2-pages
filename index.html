<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APX Premium Engine</title>

<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(160deg,#0b0f14,#111827,#0b0f14);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Segoe UI,Arial;
  color:#f5c77a;
}

.box{text-align:center}

.ring{
  width:130px;height:130px;
  border-radius:50%;
  border:3px solid rgba(245,199,122,.15);
  border-top:3px solid #f5c77a;
  animation:spin 2s linear infinite;
  margin:auto;
}

@keyframes spin{to{transform:rotate(360deg)}}

h1{
  margin:18px 0 4px;
  letter-spacing:2px;
}

small{color:#9ca3af}

.bar{
  width:220px;
  height:6px;
  background:#1f2937;
  border-radius:6px;
  margin:20px auto;
  overflow:hidden;
}
.fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#f5c77a,#facc15);
  animation:load 2.5s linear;
}
@keyframes load{from{width:0}}
</style>
</head>

<body>
<div class="box">
  <div class="ring"></div>
  <h1>APX PREMIUM</h1>
  <small>AI SIGNAL ENGINE 2026</small>
  <div class="bar"><div class="fill"></div></div>
  <small>Secure market sync…</small>
</div>

<script>
setTimeout(()=>location.href="assets.html",2800);
</script>
</body>
</html>
