<!DOCTYPE html>
<html>
<head>
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  background:radial-gradient(circle,#2b1a00,#050300);
  font-family:Arial;
  color:#f5d27a;
  text-align:center;
}

h1{
  margin-top:40px;
  letter-spacing:1px;
}

.container{
  margin:40px 20px;
}

input{
  width:90%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:16px;
  margin-bottom:15px;
}

button{
  width:90%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
}

.verify{
  background:#ffd000;
  color:#000;
}

.trial{
  background:#333;
  color:#fff;
}

.buy{
  background:#444;
  color:#9ff;
}
</style>
</head>

<body>

<h1>🚀 APX PREMIUM ENGINE</h1>

<div class="container">

  <!-- LICENSE INPUT -->
  <input id="license" placeholder="Enter License Key">

  <!-- VERIFY BUTTON -->
  <button class="verify" onclick="verifyLicense()">
    Verify License
  </button>

  <!-- ALWAYS VISIBLE -->
  <button class="trial" onclick="getTrial()">
    🎁 Get 10-Day Trial
  </button>

  <button class="buy" onclick="buyPlan()">
    💎 Buy Paid Plan
  </button>

</div>

<script>
// 🔐 already logged in?
if(localStorage.getItem("license")){
  location.href = "asset.html";
}

// ✅ VERIFY LICENSE
async function verifyLicense(){
  const key = document.getElementById("license").value.trim();

  if(!key){
    alert("Enter license OR choose Trial / Buy");
    return;
  }

  try{
    const res = await fetch(
      "https://live.mkapi009.workers.dev/?license=" + encodeURIComponent(key)
    );

    const data = await res.json();

    if(data.status === "ok"){
      localStorage.setItem("license", key);
      localStorage.setItem("plan", data.plan || "PAID");
      location.href = "asset.html";
    }else{
      alert(data.message || "Invalid license");
    }

  }catch(err){
    alert("Server error. Try again.");
  }
}

// 🎁 TRIAL REQUEST
function getTrial(){
  alert("Trial request sent. Admin will activate trial.");
  // yahan future mai worker se telegram msg lagega
}

// 💎 BUY PLAN
function buyPlan(){
  alert("Admin notified for paid plan.");
  // yahan future mai worker se telegram msg lagega
}
</script>

</body>
</html>
