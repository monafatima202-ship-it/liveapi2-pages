<!DOCTYPE html>
<html>
<head>
  <title>License Login</title>
  <style>
    body {
      background:#0b1220;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .box {
      text-align:center;
    }
    input {
      padding:10px;
      width:250px;
      margin-bottom:10px;
    }
    button {
      padding:10px 20px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>🔐 License Login</h2>

  <input id="license" placeholder="Enter License Key">
  <br>
  <button onclick="login()">Login</button>
</div>

<script>
async function login() {
  const key = document.getElementById("license").value.trim();

  if (!key) {
    alert("License required");
    return;
  }

  const device = navigator.userAgent;

  try {
    const res = await fetch(
      "https://live.mkapi009.workers.dev/?license=" + key + "&device=" + encodeURIComponent(device)
    );

    const data = await res.json();

    if (data.status === "ok") {
      localStorage.setItem("license", key);
      window.location.href = "dashboard.html";
    } else {
      alert(data.message || "Invalid license");
    }
  } catch (e) {
    alert("API error");
  }
}
</script>

</body>
</html>
