<!DOCTYPE html>
<html>
<head>
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  background:#000;
  font-family:Arial;
  color:#f5d27a;
  text-align:center;
}
.box{
  margin-top:80px;
  padding:20px;
}
input{
  width:80%;
  padding:14px;
  border-radius:10px;
  border:none;
  margin-bottom:15px;
  font-size:16px;
}
button{
  width:80%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
}
.verify{background:gold;color:#000}
.trial{background:#333;color:#fff}
.paid{background:#1f7cff;color:#fff}
</style>
</head>

<body>

<div class="box">
  <h2>🚀 APX PREMIUM ENGINE</h2>

  <input id="lic" placeholder="Enter License Key">

  <button class="verify" onclick="verify()">Verify License</button>

  <div id="extra" style="display:none">
    <button class="trial" onclick="location.href='renew.html'">
      🎁 Get 10-Day Trial
    </button>
    <button class="paid" onclick="location.href='renew.html'">
      💳 Buy Paid Plan
    </button>
  </div>
</div>

<script>
async function verify(){
  const key = document.getElementById("lic").value.trim();
  if(!key){ alert("Enter license"); return; }

  try{
    const r = await fetch(
      "https://live.mkapi009.workers.dev/?license="+key+"&device=web"
    );
    const j = await r.json();

    if(j.status==="ok"){
      localStorage.setItem("license",key);
      location.href="asset.html";   // ✅ DIRECT NEXT STEP
    }else{
      document.getElementById("extra").style.display="block";
      alert("License invalid or expired");
    }
  }catch{
    alert("Server error");
  }
}
</script>

</body>
</html>
