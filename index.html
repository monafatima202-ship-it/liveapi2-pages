<!DOCTYPE html>
<html>
<head>
  <title>APX Premium Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      background:#05070b;
      color:#f5d27a;
      font-family:Arial;
      text-align:center;
    }
    .box{
      margin-top:40%;
    }
    input,button{
      padding:12px;
      width:80%;
      margin:10px;
      border-radius:8px;
      border:none;
    }
    button{
      background:gold;
      font-weight:bold;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>🚀 APX PREMIUM ENGINE</h2>
  <input id="license" placeholder="Enter License Key">
  <button onclick="check()">Verify License</button>
  <p id="msg"></p>
</div>

<script>
async function check(){
  const lic = document.getElementById("license").value;
  const device = localStorage.getItem("device") || 
    ("dev-"+Math.random().toString(36).slice(2));
  localStorage.setItem("device",device);

  const r = await fetch(
    "https://live.mkapi009.workers.dev/?license="+lic+"&device="+device
  );
  const j = await r.json();

  if(j.status==="ok"){
    localStorage.setItem("license",lic);
    location.href="asset.html";
  }else{
    document.getElementById("msg").innerText="License invalid / expired";
  }
}
</script>

</body>
</html>
