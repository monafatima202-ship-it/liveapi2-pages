<!DOCTYPE html>
<html>
<head>
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#000;color:#f5d27a;font-family:Arial;text-align:center}
input,button{width:80%;padding:14px;margin:10px;border-radius:12px;border:none}
.verify{background:#ffd000}
.trial{background:#333;color:#fff}
.buy{background:#444;color:#fff}
</style>
</head>
<body>

<h2>🚀 APX PREMIUM ENGINE</h2>

<input id="license" placeholder="Enter License Key">

<button class="verify" onclick="verify()">Verify License</button>
<button class="trial" onclick="trial()">🎁 Get Trial</button>
<button class="buy" onclick="buy()">💎 Buy Plan</button>

<script>
const API = "https://live.mkapi009.workers.dev";

async function verify(){
  const lic = license.value.trim();
  if(!lic) return alert("Enter license");

  const r = await fetch(API+"/verify?license="+lic);
  const j = await r.json();

  if(j.ok){
    localStorage.setItem("license",lic);
    location.href="asset.html";
  }else{
    alert(j.msg||"Invalid license");
  }
}

function trial(){
  const lic = license.value.trim();
  if(!lic) return alert("Enter license");
  fetch(API+"/trial?license="+lic);
  alert("Trial request sent");
}

function buy(){
  const lic = license.value.trim();
  if(!lic) return alert("Enter license");
  fetch(API+"/buy?license="+lic);
  alert("Paid request sent");
}
</script>
</body>
</html>
