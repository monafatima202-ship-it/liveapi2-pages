<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:radial-gradient(circle at top,#2a1a00,#050300);
  color:#f5d27a;
}

.container{
  max-width:420px;
  margin:0 auto;
  padding:40px 16px;
  text-align:center;
}

h1{
  margin-bottom:25px;
  letter-spacing:1px;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:16px;
  margin-bottom:16px;
}

button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.verify{
  background:#ffd000;
  color:#000;
}

.trial{
  background:#2f2f2f;
  color:#ffd97a;
}

.buy{
  background:#2f2f2f;
  color:#6bdcff;
}

.footer{
  margin-top:20px;
  font-size:13px;
  opacity:.8;
}
</style>
</head>

<body>

<div class="container">

  <h1>🚀 APX PREMIUM ENGINE</h1>

  <input id="license" placeholder="Enter License Key">

  <button class="verify" onclick="verifyLicense()">Verify License</button>

  <button class="trial" onclick="getTrial()">🎁 Get Free Trial (10 Days)</button>

  <button class="buy" onclick="buyPlan()">💎 Buy Paid Plan</button>

  <div class="footer">
    Secure • Auto Trial • Expiry Protected
  </div>

</div>

<script>
const API = "https://live.mkapi009.workers.dev";

/* ================= VERIFY LICENSE ================= */
async function verifyLicense(){
  const lic = document.getElementById("license").value.trim();
  if(!lic){
    alert("Please enter license key");
    return;
  }

  try{
    const r = await fetch(API + "/verify?license=" + encodeURIComponent(lic));
    const j = await r.json();

    if(j.ok){
      localStorage.setItem("license", lic);
      window.location.href = "dashboard.html";
    }else{
      alert("License not active.\nGet trial or buy plan.");
    }

  }catch(e){
    alert("Server error. Try again.");
  }
}

/* ================= GET TRIAL ================= */
async function getTrial(){
  const lic = document.getElementById("license").value.trim();
  if(!lic){
    alert("Enter license first");
    return;
  }

  try{
    const r = await fetch(API + "/trial?license=" + encodeURIComponent(lic));
    const j = await r.json();

    if(j.ok){
      alert("🎁 Trial Activated (10 Days)\nNow click Verify License");
    }else{
      alert(j.msg || "Trial not available");
    }

  }catch(e){
    alert("Server error");
  }
}

/* ================= BUY PLAN ================= */
async function buyPlan(){
  const lic = document.getElementById("license").value.trim();
  if(!lic){
    alert("Enter license first");
    return;
  }

  try{
    await fetch(API + "/buy?license=" + encodeURIComponent(lic));
    alert("💎 Purchase request sent to admin");
  }catch(e){
    alert("Server error");
  }
}
</script>

</body>
</html>
