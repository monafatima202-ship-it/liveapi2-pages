<!DOCTYPE html>
<html>
<head>
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  background:#050300;
  color:#f5d27a;
  font-family:Arial;
  text-align:center;
  padding-top:80px;
}
input,button{
  width:80%;
  max-width:360px;
  padding:14px;
  margin:10px;
  border-radius:12px;
  border:none;
  font-size:16px;
}
button.primary{background:#ffd400;font-weight:bold;}
button.gray{background:#333;color:#ccc;}
.hidden{display:none;}
</style>
</head>

<body>

<h2>🚀 APX PREMIUM ENGINE</h2>

<input id="license" placeholder="Enter License Key">

<button class="primary" onclick="verify()">Verify License</button>

<div id="alt" class="hidden">
  <button class="gray" onclick="goTrial()">🎁 Get 10-Day Trial</button>
  <button class="gray" onclick="goPaid()">💎 Buy Paid Plan</button>
</div>

<script>
async function verify(){
  const key = license.value.trim();
  if(!key){
    document.getElementById("alt").classList.remove("hidden");
    return;
  }

  try{
    const r = await fetch(
      "https://live.mkapi009.workers.dev/verify?license="+key
    );
    const j = await r.json();

    if(j.status === "ok"){
      localStorage.setItem("license", key);
      location.href = "asset.html";
    }else{
      alert("Invalid / Expired License");
      document.getElementById("alt").classList.remove("hidden");
    }
  }catch{
    alert("Server error");
  }
}

function goTrial(){
  location.href = "renew.html?type=trial";
}

function goPaid(){
  location.href = "renew.html?type=paid";
}
</script>

</body>
</html>
