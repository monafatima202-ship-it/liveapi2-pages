<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>APX Premium – Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      margin:0;
      height:100vh;
      background:#0b0f1a;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Arial;
      color:#fff;
    }
    .card{
      background:#12172b;
      padding:22px;
      border-radius:16px;
      width:100%;
      max-width:380px;
      box-shadow:0 0 25px rgba(0,0,0,.5);
      text-align:center;
    }
    h2{color:#f5c542;margin-bottom:8px}
    input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:none;
      margin-top:12px;
      background:#0f1430;
      color:#fff;
      font-size:14px;
    }
    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      background:#f5c542;
      color:#000;
      font-weight:bold;
      margin-top:16px;
      cursor:pointer;
    }
    a{
      display:block;
      margin-top:16px;
      color:#f5c542;
      text-decoration:none;
      font-weight:bold;
      font-size:14px;
    }
    small{color:#9aa3c7}
  </style>
</head>
<body>

<div class="card">
  <h2>⚡ APX PREMIUM ENGINE</h2>
  <small>Enter your license key to continue</small>

  <input id="license" placeholder="Enter License Key">

  <button onclick="login()">Login</button>

  <a href="renew.html">🆕 New User? Get 10-Day Trial</a>
</div>

<script>
const WORKER_URL = "https://live.mkapi009.workers.dev";

async function login(){
  const key = document.getElementById("license").value.trim();
  if(!key){
    alert("Please enter license key");
    return;
  }

  const device = navigator.userAgent;

  try{
    const res = await fetch(
      `${WORKER_URL}?license=${key}&device=${encodeURIComponent(device)}`
    );
    const data = await res.json();

    if(data.error){
      if(data.message && data.message.toLowerCase().includes("expired")){
        window.location.href = "renew.html";
      }else{
        alert(data.message || "Invalid license");
      }
      return;
    }

    localStorage.setItem("license", key);
    window.location.href = "dashboard.html";

  }catch(e){
    alert("Network / API error");
  }
}
</script>

</body>
</html>
