<!DOCTYPE html>
<html>
<head>
<title>Assets</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  margin:0;
  background:#050300;
  color:#f5d27a;
  font-family:Arial;
}
h2{text-align:center;padding:15px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:15px;
}
.btn{
  background:#1a1a1a;
  padding:20px;
  border-radius:14px;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>
<h2>📊 Select Pair</h2>

<div class="grid">
  <div class="btn" onclick="go('EUR/USD')">EUR/USD</div>
  <div class="btn" onclick="go('GBP/USD')">GBP/USD</div>
  <div class="btn" onclick="go('USD/JPY')">USD/JPY</div>
  <div class="btn" onclick="go('AUD/USD')">AUD/USD</div>
  <div class="btn" onclick="go('USD/CHF')">USD/CHF</div>
  <div class="btn" onclick="go('USD/CAD')">USD/CAD</div>
  <div class="btn" onclick="go('NZD/USD')">NZD/USD</div>
  <div class="btn" onclick="go('EUR/GBP')">EUR/GBP</div>
</div>

<script>
if(!localStorage.getItem("license")) location.href="index.html";
function go(p){
  location.href="dashboard.html?pair="+encodeURIComponent(p);
}
</script>
</body>
</html>
