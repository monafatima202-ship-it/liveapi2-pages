<!DOCTYPE html>
<html>
<head>
<title>Select Asset</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  background:#070b10;
  color:#f5d27a;
  font-family:Arial;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:20px;
}
.btn{
  background:#111;
  border:1px solid #f5d27a;
  padding:20px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}
</style>
</head>
<body>

<h2 style="text-align:center;">📊 Select Asset</h2>

<div class="grid">
  <div class="btn" onclick="go('EUR/USD')">EUR/USD</div>
  <div class="btn" onclick="go('GBP/USD')">GBP/USD</div>
  <div class="btn" onclick="go('USD/JPY')">USD/JPY</div>
  <div class="btn" onclick="go('AUD/USD')">AUD/USD</div>
  <div class="btn" onclick="go('USD/CHF')">USD/CHF</div>
  <div class="btn" onclick="go('USD/CAD')">USD/CAD</div>
</div>

<script>
function go(p){
  location.href="dashboard.html?pair="+encodeURIComponent(p);
}
</script>

</body>
</html>
