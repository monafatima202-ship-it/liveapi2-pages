<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Assets</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top,#003d34,#000);
  color:#8fffe0;
}
.container{
  max-width:420px;
  margin:auto;
  padding:30px 16px;
}
h1{text-align:center;margin-bottom:8px}
.sub{text-align:center;opacity:.7;margin-bottom:20px}
.section{margin-top:26px}
.section h2{margin-bottom:12px;font-size:18px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.asset{
  background:#062e28;
  border:none;
  border-radius:18px;
  padding:18px 12px;
  color:#8fffe0;
  font-size:17px;
  cursor:pointer;
  box-shadow:0 0 20px rgba(0,255,200,.15);
}
.asset small{
  display:block;
  font-size:13px;
  opacity:.7;
  margin-top:4px;
}
.asset:hover{
  box-shadow:0 0 30px rgba(0,255,200,.45);
  transform:scale(1.02);
}
.back{
  margin-top:30px;
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  font-size:18px;
  font-weight:bold;
  background:#ffd000;
  color:#000;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- 🔐 LICENSE + DEVICE SAFEGUARD -->
<script>
(async function(){
  const API = "https://liveproxy.mkapi009.workers.dev";
  const license = localStorage.getItem("APX_LICENSE");

  if(!license){
    location.replace("admin.html");
    return;
  }

  // 🔐 DEVICE ID (stable but simple)
  const deviceId =
    navigator.userAgent +
    "|" + screen.width + "x" + screen.height;

  try{
    const r = await fetch(
      API + "/verify?license=" +
      encodeURIComponent(license) +
      "&device=" + encodeURIComponent(deviceId)
    );

    const j = await r.json();

    if(!j.ok){
      localStorage.removeItem("APX_LICENSE");
      alert(j.error || "Access denied");
      location.replace("admin.html");
      return;
    }

    // ✅ License + device OK → page continues

  }catch(e){
    location.replace("admin.html");
  }
})();
</script>
<div class="container">

<h1>APX ASSETS</h1>
<div class="sub">Select market to generate signals</div>

<!-- FOREX -->
<div class="section">
<h2>🌍 FOREX</h2>
<div class="grid">
  <button class="asset" onclick="go('EUR_USD')">EUR / USD<small>Major</small></button>
  <button class="asset" onclick="go('GBP_USD')">GBP / USD<small>Major</small></button>
  <button class="asset" onclick="go('USD_JPY')">USD / JPY<small>Major</small></button>
  <button class="asset" onclick="go('AUD_USD')">AUD / USD<small>Major</small></button>
  <button class="asset" onclick="go('USD_CHF')">USD / CHF<small>Major</small></button>
  <button class="asset" onclick="go('EUR_GBP')">EUR / GBP<small>Cross</small></button>
</div>
</div>

<!-- METALS -->
<div class="section">
<h2>🥇 METALS</h2>
<div class="grid">
  <button class="asset" onclick="go('XAU_USD')">GOLD (XAU/USD)<small>Metal</small></button>
</div>
</div>

<!-- CRYPTO -->
<div class="section">
<h2>🪙 CRYPTO</h2>
<div class="grid">
  <button class="asset" onclick="go('BTC_USDT')">BTC / USDT<small>Crypto</small></button>
  <button class="asset" onclick="go('ETH_USDT')">ETH / USDT<small>Crypto</small></button>
  <button class="asset" onclick="go('BNB_USDT')">BNB / USDT<small>Crypto</small></button>
  <button class="asset" onclick="go('XRP_USDT')">XRP / USDT<small>Crypto</small></button>
</div>
</div>

<button class="back" onclick="location.href='dashboard.html'">
← BACK TO DASHBOARD
</button>

</div>

<script>
function go(pair){
  location.href = "dashboard.html?pair=" + encodeURIComponent(pair);
}
</script>

</body>
</html>
