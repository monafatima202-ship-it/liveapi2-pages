<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Select Asset – APX Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at center,#0a2b22,#020807);
  color:#64ffda;
}
.container{
  min-height:100vh;
  padding:25px 15px;
  text-align:center;
}
h1{
  margin:20px 0 5px;
  letter-spacing:2px;
}
.sub{
  font-size:14px;
  opacity:.8;
  margin-bottom:25px;
}

.section{
  margin-top:25px;
  text-align:left;
}
.section h2{
  margin:10px 0;
  font-size:18px;
  letter-spacing:1px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.asset{
  padding:16px;
  border-radius:18px;
  background:#041d18;
  box-shadow:0 0 20px rgba(0,255,200,.35);
  font-weight:bold;
  text-align:center;
  cursor:pointer;
  transition:.25s;
}
.asset:hover{
  transform:scale(1.05);
  box-shadow:0 0 35px rgba(0,255,200,.7);
}
.asset span{
  display:block;
  font-size:13px;
  opacity:.75;
  margin-top:4px;
}

.back{
  margin-top:30px;
  padding:14px 30px;
  border:none;
  border-radius:18px;
  background:#ffd000;
  font-size:16px;
  font-weight:bold;
  color:#000;
}
</style>
</head>

<body>
<div class="container">

  <h1>APX ASSETS</h1>
  <div class="sub">Select market to generate signals</div>

  <!-- FOREX -->
  <div class="section">
    <h2>🌍 FOREX</h2>
    <div class="grid">
      <div class="asset" onclick="go('EUR_USD')">EUR/USD<span>Major</span></div>
      <div class="asset" onclick="go('GBP_USD')">GBP/USD<span>Major</span></div>
      <div class="asset" onclick="go('USD_JPY')">USD/JPY<span>Major</span></div>
      <div class="asset" onclick="go('AUD_USD')">AUD/USD<span>Major</span></div>
      <div class="asset" onclick="go('USD_CHF')">USD/CHF<span>Major</span></div>
      <div class="asset" onclick="go('EUR_GBP')">EUR/GBP<span>Cross</span></div>
    </div>
  </div>

  <!-- CRYPTO -->
  <div class="section">
    <h2>🪙 CRYPTO</h2>
    <div class="grid">
      <div class="asset" onclick="go('BTCUSDT')">BTC/USDT<span>Crypto</span></div>
      <div class="asset" onclick="go('ETHUSDT')">ETH/USDT<span>Crypto</span></div>
      <div class="asset" onclick="go('BNBUSDT')">BNB/USDT<span>Crypto</span></div>
      <div class="asset" onclick="go('XRPUSDT')">XRP/USDT<span>Crypto</span></div>
    </div>
  </div>

  <button class="back" onclick="location.href='dashboard.html'">
    ⬅ BACK TO DASHBOARD
  </button>

</div>

<script>
function go(pair){
  location.href = "dashboard.html?pair=" + encodeURIComponent(pair);
}
</script>

</body>
</html>
