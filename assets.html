<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Assets</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:radial-gradient(circle at center,#120800,#020100);
  color:#ffd36a;
}

.wrap{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:60px;
}

h1{
  margin-bottom:30px;
  letter-spacing:2px;
}

/* ===== ASSET BUTTON ===== */
.asset{
  width:85%;
  max-width:380px;
  background:#111;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  box-shadow:0 0 12px rgba(255,208,0,.25);
  transition:.25s;
}

.asset:hover{
  box-shadow:0 0 22px rgba(255,208,0,.65);
  transform:scale(1.02);
}

.name{
  font-size:18px;
  font-weight:bold;
}

.meta{
  font-size:13px;
  opacity:.8;
}

/* ===== STATUS ===== */
.open{
  color:#00ffb3;
  text-shadow:0 0 6px #00ffb3;
}

.closed{
  color:#ff6b6b;
}

/* ===== FOOTER ===== */
.footer{
  margin-top:40px;
  font-size:12px;
  opacity:.6;
}
</style>
</head>

<body>

<div class="wrap">

  <h1>📊 APX ASSETS</h1>

  <!-- EURUSD -->
  <div class="asset" onclick="go('EURUSD')">
    <div>
      <div class="name">EUR / USD</div>
      <div class="meta">Accuracy: 82% • Forex</div>
    </div>
    <div class="open">OPEN</div>
  </div>

  <!-- GBPUSD -->
  <div class="asset" onclick="go('GBPUSD')">
    <div>
      <div class="name">GBP / USD</div>
      <div class="meta">Accuracy: 79% • Forex</div>
    </div>
    <div class="open">OPEN</div>
  </div>

  <!-- USDJPY -->
  <div class="asset" onclick="go('USDJPY')">
    <div>
      <div class="name">USD / JPY</div>
      <div class="meta">Accuracy: 85% • Forex</div>
    </div>
    <div class="open">OPEN</div>
  </div>

  <!-- BTC -->
  <div class="asset" onclick="go('BTCUSDT')">
    <div>
      <div class="name">BTC / USDT</div>
      <div class="meta">Accuracy: 91% • Crypto (24/7)</div>
    </div>
    <div class="open">24/7</div>
  </div>

  <div class="footer">
    Signals generated after asset selection • 1 minute ahead
  </div>

</div>

<script>
/* ===== LICENSE CHECK ===== */
const API = "https://live.mkapi009.workers.dev";
const lic = localStorage.getItem("license");

if(!lic){
  location.href="index.html";
}else{
  fetch(API + "/verify?license=" + encodeURIComponent(lic))
    .then(r=>r.json())
    .then(j=>{
      if(!j.ok){
        localStorage.removeItem("license");
        location.href="index.html";
      }
    })
    .catch(()=>{
      alert("Server error");
    });
}

/* ===== REDIRECT TO DASHBOARD ===== */
function go(pair){
  location.href = "dashboard.html?pair=" + pair;
}
</script>

</body>
</html>
