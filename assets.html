<!DOCTYPE html>
<html>
<head>
<title>Assets</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#050505;color:#ffd46a;font-family:Arial}
h2{text-align:center}
.asset{
  padding:15px;
  margin:10px;
  background:#111;
  border-radius:12px;
  text-align:center;
}
</style>
</head>

<body>
<h2>📊 Select Asset</h2>

<div class="asset" onclick="go('EURUSD')">EUR/USD</div>
<div class="asset" onclick="go('GBPUSD')">GBP/USD</div>
<div class="asset" onclick="go('USDJPY')">USD/JPY</div>

<script>
const API="https://live.mkapi009.workers.dev";
const lic=localStorage.getItem("license");

if(!lic) location.href="index.html";

fetch(API+"/verify?license="+lic)
.then(r=>r.json())
.then(j=>{
  if(!j.ok){
    localStorage.removeItem("license");
    location.href="index.html";
  }
});

function go(pair){
  location.href="dashboard.html?pair="+pair;
}
</script>
</body>
</html>
