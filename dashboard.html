<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at center,#06231c,#010706);
  color:#64ffda;
}
.center{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding-bottom:40px;
}
.ring{
  margin-top:40px;
  width:180px;height:180px;border-radius:50%;
  border:6px solid rgba(100,255,218,.15);
  border-top:6px solid #64ffda;
  animation:spin 3s linear infinite;
  display:flex;align-items:center;justify-content:center;
}
@keyframes spin{100%{transform:rotate(360deg)}}
h1{margin:25px 0 6px;letter-spacing:2px}
.sub{opacity:.8;margin-bottom:10px}
.badge{
  padding:10px 20px;
  border-radius:30px;
  background:#00ff99;
  color:#000;
  font-weight:bold;
  margin-bottom:15px;
}
.bar{
  width:80%;height:10px;
  background:rgba(255,255,255,.1);
  border-radius:20px;
  overflow:hidden;
}
.fill{
  height:100%;width:100%;
  background:linear-gradient(90deg,#64ffda,#00c9a7);
}
.count{margin:10px 0 20px}

.signal{
  width:85%;
  margin-top:18px;
  padding:16px;
  border-radius:16px;
  background:#041b15;
  border-left:6px solid #00ffcc;
  box-shadow:0 0 15px rgba(0,255,200,.25);
}
.glow{
  animation:glow 1s infinite alternate;
}
@keyframes glow{
  from{box-shadow:0 0 10px #00ffcc}
  to{box-shadow:0 0 25px #00ffcc}
}
.confBar{
  margin-top:8px;
  width:100%;
  height:6px;
  background:#033;
  border-radius:10px;
  overflow:hidden;
}
.confFill{
  height:100%;
  background:#00ffcc;
}
.btn{
  margin-top:30px;
  padding:16px 36px;
  background:#ffd000;
  color:#000;
  border:none;
  border-radius:18px;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="center">

  <div class="ring">📡</div>

  <h1>APX PREMIUM ENGINE</h1>
  <div class="sub">ESTABLISHING SECURE CONNECTION</div>

  <div class="badge" id="market">CHECKING MARKET…</div>

  <div class="bar"><div class="fill"></div></div>
  <div class="count" id="count">Next signal in: 60s</div>

  <div id="signals"></div>

  <button class="btn" onclick="location.href='assets.html'">
    ENTER ASSETS
  </button>

</div>

<audio id="bell">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-bell-notification-933.mp3">
</audio>

<script>
const pair =
  new URLSearchParams(location.search).get("pair") || "EUR_USD";

const box = document.getElementById("signals");
const bell = document.getElementById("bell");
const market = document.getElementById("market");

function utc6(ts){
  const d = new Date(ts*1000);
  d.setUTCHours(d.getUTCHours()+6);
  return d.toLocaleTimeString();
}

/* ===== NEWS FILTER ===== */
async function checkNews(){
  try{
    const r = await fetch(
      "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
    );
    const news = await r.json();
    const now = Date.now();
    const cur = pair.split("_");

    for(const n of news){
      if(!cur.includes(n.currency)) continue;
      if(n.impact !== "High") continue;

      const t = new Date(n.date+" "+n.time+" UTC").getTime();
      if(Math.abs(t-now) <= 30*60*1000){
        box.innerHTML = `
          <div class="signal glow">
            📰 <b>HIGH IMPACT NEWS</b><br>
            ${n.currency} – ${n.title}<br>
            ⏰ ${new Date(t).toLocaleTimeString()} (UTC+6)<br>
            ⚠️ Signals paused
          </div>`;
        return true;
      }
    }
    return false;
  }catch{
    return false;
  }
}

/* ===== SIGNAL ENGINE ===== */
async function loadSignals(){
  box.innerHTML="";
  market.innerText="MARKET OPEN";

  if(await checkNews()) return;

  try{
    const r = await fetch(
      "https://milongazi197.serv00.net/candle_data.php?instrument="+pair+"&count=20"
    );
    const data = await r.json();
    if(!data.candles) throw "no data";

    let up=0,down=0,range=0;
    data.candles.forEach(c=>{
      if(c.close>c.open) up++; else down++;
      range+=Math.abs(c.high-c.low);
    });

    const dir = up>down ? "CALL" : "PUT";
    const avg = range/data.candles.length;
    const gap = avg<0.0005?2:avg<0.0012?5:10;

    let conf = Math.min(92,82+Math.abs(up-down));
    const last = data.candles.at(-1).time;

    for(let i=1;i<=5;i++){
      if(conf<80) break;
      const t = last+(gap*60*i);
      const glow = conf>=85;
      if(glow) bell.play();

      box.innerHTML += `
      <div class="signal ${glow?'glow':''}">
        <b>${pair}</b><br>
        ⏰ ${utc6(t)} (UTC+6)<br>
        📈 ${dir} • Confidence ${conf}%<br>
        ⏱ Gap ${gap} min
        <div class="confBar">
          <div class="confFill" style="width:${conf}%"></div>
        </div>
      </div>`;
      conf-=2;
    }
  }catch{
    box.innerHTML =
      `<div class="signal">Signal server unavailable</div>`;
  }
}

let sec=60;
setInterval(()=>{
  sec--; if(sec<=0){sec=60; loadSignals();}
  document.getElementById("count").innerText=
    "Next signal in: "+sec+"s";
},1000);

loadSignals();
</script>
</body>
</html>
