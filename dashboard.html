<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top,#06261f,#020b09);
  color:#7fffe6;
}
.container{
  max-width:430px;
  margin:0 auto;
  padding:30px 14px;
  text-align:center;
}
h1{
  margin:15px 0 5px;
  font-size:28px;
}
.sub{
  opacity:.7;
  margin-bottom:20px;
}
.progress{
  height:10px;
  background:#063c31;
  border-radius:20px;
  overflow:hidden;
}
.progress span{
  display:block;
  height:100%;
  width:60%;
  background:#19ffd1;
  animation:load 4s linear infinite;
}
@keyframes load{
  0%{width:0}
  100%{width:100%}
}
.status{
  margin:15px 0;
  padding:12px;
  border-radius:16px;
  background:#04231c;
  box-shadow:0 0 25px rgba(0,255,200,.25);
}
.signal{
  background:#04231c;
  border-radius:18px;
  padding:14px;
  margin:14px 0;
  box-shadow:0 0 25px rgba(0,255,200,.25);
  text-align:left;
}
.signal.call{border-left:5px solid #1cff92}
.signal.put{border-left:5px solid #ff5c5c}
.glow{
  box-shadow:0 0 35px rgba(0,255,200,.55);
}
.confBar{
  height:6px;
  background:#022019;
  border-radius:8px;
  margin-top:6px;
  overflow:hidden;
}
.confFill{
  height:100%;
  background:#1cffd4;
}
.btn{
  width:100%;
  padding:16px;
  margin-top:18px;
  border:none;
  border-radius:20px;
  font-size:16px;
  font-weight:bold;
  background:#ffd000;
  color:#000;
}
.news{
  margin-top:18px;
  padding:14px;
  border-radius:16px;
  background:#2b1f00;
  color:#ffd77a;
}
</style>
</head>

<body>
<div class="container">

  <h1>APX PREMIUM ENGINE</h1>
  <div class="sub">Signals live (API based)</div>

  <div class="progress"><span></span></div>

  <div id="status" class="status">Connecting to signal server…</div>

  <div id="signals"></div>

  <div id="news" class="news">Loading high impact news…</div>

  <button class="btn" onclick="goAssets()">ENTER ASSETS</button>

</div>

<script>
/* ================= CONFIG ================= */
const API = "https://live.mkapi009.workers.dev";
const PROXY = "https://liveproxy.mkapi009.workers.dev";
const pair =
  new URLSearchParams(location.search).get("pair") || "EUR_GBP";

/* ================= LICENSE CHECK ================= */
const lic = localStorage.getItem("license");
if(!lic){
  location.href="index.html";
}

fetch(API + "/verify?license=" + encodeURIComponent(lic))
.then(r=>r.json())
.then(j=>{
  if(!j.ok){
    localStorage.removeItem("license");
    location.href="index.html";
  }
});

/* ================= HELPERS ================= */
function pad(n){return String(n).padStart(2,"0");}

/* ================= LOAD SIGNALS ================= */
async function loadSignals(){
  const box = document.getElementById("signals");
  const status = document.getElementById("status");
  box.innerHTML="";
  status.innerText="Analyzing market…";

  try{
    const r = await fetch(
      PROXY + "/candles?instrument=" + pair + "&count=20"
    );
    const j = await r.json();
    const candles = j.data;
    if(!candles || candles.length<10) throw "NO_DATA";

    let call=0, put=0, vol=0, range=0;

    candles.forEach(c=>{
      if(c.direction==="call") call++; else put++;
      vol+=c.volume;
      range+=Math.abs(c.high-c.low);
    });

    const trend = call>put?"CALL":"PUT";
    const baseConf = Math.min(92,80+Math.abs(call-put));
    const avgRange = range/candles.length;

    /* ===== GAP LOGIC (NOT RANDOM) ===== */
    let gaps;
    if(avgRange<0.0003){
      gaps=[2,4,6,8,10];
    }else if(avgRange<0.0007){
      gaps=[3,6,9,12,15];
    }else{
      gaps=[5,10,15,20,25];
    }

    const last = candles[candles.length-1];
    let [hh,mm]=last.time.split(":").map(Number);

    let acc=0;
    for(let i=0;i<5;i++){
      acc+=gaps[i];
      const total=hh*60+mm+acc;
      const h=Math.floor(total/60)%24;
      const m=total%60;

      const conf=baseConf-i*2;
      if(conf<80) continue;

      box.innerHTML+=`
      <div class="signal glow ${trend.toLowerCase()}">
        <b>${pair}</b><br>
        ⏰ ${pad(h)}:${pad(m)} (UTC+6)<br>
        📈 ${trend} • Confidence ${conf}%<br>
        📊 Avg Volume ${Math.round(vol/candles.length)}
        <div class="confBar">
          <div class="confFill" style="width:${conf}%"></div>
        </div>
      </div>`;
    }

    status.innerText="Market Open • Signals Live";

  }catch(e){
    status.innerText="Signal server unavailable";
  }
}

/* ================= NEWS ================= */
async function loadNews(){
  try{
    const r = await fetch(PROXY+"/news");
    const j = await r.json();
    if(!j.data || !j.data.length){
      document.getElementById("news").innerText="No high impact news";
      return;
    }
    document.getElementById("news").innerHTML=
      "<b>High Impact News</b><br>"+
      j.data.map(n=>`⏰ ${n.time} • ${n.title}`).join("<br>");
  }catch{
    document.getElementById("news").innerText="News unavailable";
  }
}

/* ================= NAV ================= */
function goAssets(){
  location.href="assets.html";
}

/* ================= INIT ================= */
loadSignals();
loadNews();
setInterval(loadSignals,60000);
</script>
</body>
</html>
