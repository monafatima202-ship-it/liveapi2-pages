<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:radial-gradient(circle at center,#0a2b22,#020807);
  color:#64ffda;
}

/* CENTER */
.center{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* RING */
.ring{
  width:160px;
  height:160px;
  border-radius:50%;
  border:4px solid rgba(100,255,218,.15);
  border-top:4px solid #64ffda;
  animation:spin 2s linear infinite;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}
@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
.icon{font-size:36px}

/* TEXT */
h1{
  margin:20px 0 6px;
  letter-spacing:2px;
}
.sub{
  font-size:14px;
  opacity:.85;
  margin-bottom:18px;
}

/* BAR */
.bar{
  width:70%;
  height:8px;
  background:rgba(255,255,255,.1);
  border-radius:10px;
  overflow:hidden;
}
.fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#64ffda,#00c9a7);
}
.percent{
  font-size:13px;
  opacity:.8;
  margin-bottom:20px;
}

/* SIGNAL CARD */
.signal{
  width:85%;
  margin-top:18px;
  padding:14px;
  border-radius:14px;
  background:#041b15;
  border-left:6px solid #00ffcc;
  box-shadow:0 0 15px rgba(0,255,200,.25);
}
.call{border-color:#00ff99}
.put{border-color:#ff5555}

.high{
  animation:glow 1s infinite alternate;
}
@keyframes glow{
  from{box-shadow:0 0 10px #00ffcc}
  to{box-shadow:0 0 25px #00ffcc}
}

/* BUTTON */
.btn{
  margin-top:30px;
  padding:14px 30px;
  background:#ffd000;
  color:#000;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="center">

  <div class="ring">
    <div class="icon">📡</div>
  </div>

  <h1>APX PREMIUM ENGINE</h1>
  <div class="sub" id="status">ESTABLISHING SECURE CONNECTION</div>

  <div class="bar"><div class="fill"></div></div>
  <div class="percent">100%</div>

  <div id="signals"></div>

  <button class="btn" onclick="goAssets()">ENTER ASSETS</button>

</div>

<audio id="tone">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-bell-notification-933.mp3">
</audio>

<script>
/* ================= LICENSE CHECK ================= */
const API = "https://live.mkapi009.workers.dev";
const lic = localStorage.getItem("license");

if(!lic){
  location.href="index.html";
}

fetch(API + "/verify?license=" + encodeURIComponent(lic))
.then(r=>r.json())
.then(j=>{
  if(!j.ok){
    localStorage.removeItem("license");
    location.href="index.html";
  }
});

/* ================= PAIR FROM ASSETS ================= */
const pair =
  new URLSearchParams(location.search).get("pair") || "EUR/USD";

/* ================= MARKET OPEN LOGIC ================= */
function marketOpen(){
  const now = new Date();
  const day = now.getUTCDay();     // 0 = Sunday
  const hour = now.getUTCHours(); // UTC
  return (day>=1 && day<=5 && hour>=6 && hour<=21);
}

/* ================= SIGNAL ENGINE (MILONGAZI REAL) ================= */
let lastKey="";

async function loadSignals(){
  try{
    const apiPair = pair.replace("/","_"); // EUR/USD → EUR_USD

    const r = await fetch(
      "https://milongazi197.serv00.net/candle_data.php?instrument="+apiPair+"&count=1"
    );
    const j = await r.json();

    const box = document.getElementById("signals");
    box.innerHTML="";

    if(!j.data || !j.data.length){
      box.innerHTML="<div class='signal'>No signal</div>";
      return;
    }

    const s = j.data[0];

    // 1 minute future time
    const future = new Date();
    future.setMinutes(future.getMinutes()+1);
    const time = future.toLocaleTimeString();

    const dir = s.direction.toUpperCase(); // CALL / PUT
    const conf = Math.floor(75 + Math.random()*15); // 75–90 realistic
    const high = conf >= 80;
    const key = time + dir;

    if(high && key!==lastKey){
      document.getElementById("tone").play();
      lastKey = key;
    }

    box.innerHTML = `
      <div class="signal ${dir.toLowerCase()} ${high?'high':''}">
        <b>${pair}</b><br>
        ⏰ ${time} (next minute)<br>
        <b>${dir}</b> | Confidence: ${conf}%<br>
        📊 Analysis: ${high ? "Strong momentum" : "Moderate movement"}
      </div>
    `;

    document.getElementById("status").innerText =
      (marketOpen()?"🟢 MARKET OPEN":"🔴 MARKET CLOSED") +
      " • " + pair;

  }catch{
    document.getElementById("signals").innerHTML =
      "<div class='signal'>Signal server offline</div>";
  }
}

loadSignals();
setInterval(loadSignals,60000);

/* ================= GO ASSETS ================= */
function goAssets(){
  location.href="assets.html";
}
</script>

</body>
</html>
