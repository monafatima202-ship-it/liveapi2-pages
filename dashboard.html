<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#000;color:#ffd46a;font-family:Arial}
.header{text-align:center;padding:15px;background:#111}
.signal{
  margin:10px;
  padding:15px;
  background:#111;
  border-left:5px solid gold;
  border-radius:12px;
}
.high{border-color:#00ff99}
</style>
</head>

<body>
<div class="header">
<h2>🚀 APX PREMIUM ENGINE</h2>
<div id="top"></div>
</div>

<div id="signals"></div>

<audio id="beep">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-bell-notification-933.mp3">
</audio>

<script>
const API="https://live.mkapi009.workers.dev";
const lic=localStorage.getItem("license");
if(!lic) location.href="index.html";

fetch(API+"/verify?license="+lic)
.then(r=>r.json())
.then(j=>{
  if(!j.ok){localStorage.removeItem("license");location.href="index.html";}
});

const pair=new URLSearchParams(location.search).get("pair");
top.innerText="Pair: "+pair+" | "+new Date().toLocaleTimeString();

let last="";

async function load(){
  try{
    const r=await fetch("https://milongazi197.serv00.net/candle_data.php?instrument="+pair+"&count=2");
    const j=await r.json();

    signals.innerHTML="";
    j.forEach(s=>{
      const key=s.time+s.dir;
      const cls=s.conf>=80?"high":"";
      if(key!==last && s.conf>=80){
        beep.play();
        navigator.vibrate(200);
        last=key;
      }
      signals.innerHTML+=`
        <div class="signal ${cls}">
          ${pair}<br>
          ${s.time} | ${s.dir} | ${s.conf}%
        </div>`;
    });
  }catch{
    signals.innerHTML="<p style='color:red'>Failed to load signals</p>";
  }
}
load();
setInterval(load,60000);
</script>
</body>
</html>
