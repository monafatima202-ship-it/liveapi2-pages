<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:radial-gradient(circle at top,#021b18,#000);
  font-family:Segoe UI,Arial;
  color:#7fffe5;
  text-align:center;
}
h1{margin-top:40px;font-size:36px}
.sub{opacity:.7;margin-bottom:10px}

.badge{
  display:inline-block;
  padding:10px 25px;
  border-radius:30px;
  background:#00ff9c;
  color:#000;
  font-weight:bold;
  margin:15px 0;
}

.bar{
  width:80%;
  height:10px;
  margin:10px auto;
  background:#013;
  border-radius:10px;
  overflow:hidden;
}
.bar div{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#00ffd0,#00ff7b);
}

.count{margin:10px;font-size:16px}

.signal{
  width:85%;
  margin:18px auto;
  padding:18px;
  border-radius:15px;
  background:#031e1a;
  box-shadow:0 0 18px #00ffd0;
}
.signal.glow{
  box-shadow:0 0 28px #00ffb3;
}
.signal b{font-size:20px}

.confBar{
  margin-top:10px;
  height:6px;
  background:#022;
  border-radius:6px;
}
.confFill{
  height:100%;
  background:#00ffb3;
  border-radius:6px;
}

.news{
  background:#2b0000;
  color:#ffbdbd;
  box-shadow:0 0 20px red;
}

button{
  margin:25px 0 40px;
  padding:18px 45px;
  border:none;
  border-radius:35px;
  font-size:18px;
  font-weight:bold;
  background:#ffd400;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>APX PREMIUM ENGINE</h1>
<div class="sub">ESTABLISHING SECURE CONNECTION</div>

<div id="market" class="badge">CHECKING MARKET...</div>

<div class="bar"><div></div></div>
<div id="countdown" class="count">Next signal in: --s</div>

<div id="signals"></div>

<button onclick="location.href='assets.html'">ENTER ASSETS</button>

<script>
const PROXY = "https://liveproxy.mkapi009.workers.dev";
const pair = new URLSearchParams(location.search).get("pair") || "EUR_USD";
const box = document.getElementById("signals");
const market = document.getElementById("market");
const countdown = document.getElementById("countdown");

function utc6(ts){
  const d=new Date(ts*1000);
  d.setUTCHours(d.getUTCHours()+6);
  return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

/* ===== MARKET OPEN CHECK ===== */
function marketOpen(){
  const d=new Date();
  const day=d.getUTCDay();
  return day!==0 && day!==6;
}

/* ===== NEWS FILTER ===== */
async function checkNews(){
  const base = pair.split("_")[0];
  try{
    const r=await fetch(`${PROXY}/news?symbol=${base}`);
    const news=await r.json();
    const now=Date.now();
    for(const n of news){
      const t=new Date(n.date).getTime();
      if(Math.abs(t-now)/60000<=30){
        return n;
      }
    }
  }catch{}
  return null;
}

/* ===== SIGNAL ENGINE ===== */
async function loadSignals(){
  box.innerHTML="";

  if(!marketOpen()){
    market.innerText="MARKET CLOSED";
    return;
  }
  market.innerText="MARKET OPEN";

  const news=await checkNews();
  if(news){
    box.innerHTML=`
      <div class="signal news">
        📰 ${news.title}<br>
        Impact: ${news.impact}<br>
        Signals paused due to news
      </div>`;
    return;
  }

  try{
    const r=await fetch(`${PROXY}/candles?instrument=${pair}&count=20`);
    const data=await r.json();
    if(!data.candles) throw 1;

    let up=0,down=0,range=0;
    data.candles.forEach(c=>{
      if(c.close>c.open) up++; else down++;
      range+=Math.abs(c.high-c.low);
    });

    const dir = up>down?"CALL":"PUT";
    const vol = range/data.candles.length;

    let gap = vol<0.0006?1:vol<0.0012?2:5;
    let baseConf = Math.min(92,82+Math.abs(up-down));

    const last = data.candles[data.candles.length-1].time;

    for(let i=1;i<=5;i++){
      const conf=baseConf-(i-1)*2;
      if(conf<80) continue;

      const t=last+(gap*60*i);

      box.innerHTML+=`
        <div class="signal ${conf>=85?'glow':''}">
          <b>${pair.replace("_","")}</b><br>
          ⏰ ${utc6(t)} (UTC+6)<br>
          📈 ${dir} • Confidence ${conf}%<br>
          ⏱ Gap: ${gap} min
          <div class="confBar">
            <div class="confFill" style="width:${conf}%"></div>
          </div>
        </div>`;
    }

  }catch{
    box.innerHTML=`
      <div class="signal">
        Signal server unavailable
      </div>`;
  }
}

/* ===== COUNTDOWN ===== */
let sec=60;
setInterval(()=>{
  sec--;
  if(sec<=0){sec=60;loadSignals();}
  countdown.innerText="Next signal in: "+sec+"s";
},1000);

loadSignals();
</script>

</body>
</html>
