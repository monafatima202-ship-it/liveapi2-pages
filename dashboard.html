<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:radial-gradient(circle at center,#06241d,#010504);
  color:#64ffda;
}
.center{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.ring{
  width:180px;height:180px;border-radius:50%;
  border:6px solid rgba(100,255,218,.15);
  border-top:6px solid #64ffda;
  animation:spin 2s linear infinite;
  display:flex;align-items:center;justify-content:center;
}
@keyframes spin{to{transform:rotate(360deg)}}
.icon{font-size:42px}
h1{margin:20px 0 6px;letter-spacing:2px}
.sub{font-size:14px;opacity:.85;margin-bottom:10px}
.badge{
  padding:6px 16px;border-radius:20px;
  background:#0f3; color:#000;
  font-weight:bold;margin-bottom:14px;
}
.bar{
  width:75%;height:8px;
  background:rgba(255,255,255,.15);
  border-radius:10px;overflow:hidden;
}
.fill{
  height:100%;width:100%;
  background:linear-gradient(90deg,#64ffda,#00ffcc);
}
.count{margin-top:8px;font-size:14px}
.signal{
  margin-top:18px;
  padding:14px;
  width:85%;
  border-radius:14px;
  background:#031814;
  border-left:6px solid #00ffcc;
  box-shadow:0 0 18px rgba(0,255,200,.35);
  animation:glow 1s infinite alternate;
}
.put{border-color:#ff5555}
@keyframes glow{
  from{box-shadow:0 0 10px rgba(0,255,200,.4)}
  to{box-shadow:0 0 26px rgba(0,255,200,.8)}
}
.btn{
  margin-top:28px;
  padding:14px 36px;
  background:#ffd000;
  color:#000;border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="center">

  <div class="ring"><div class="icon">📡</div></div>

  <h1>APX PREMIUM ENGINE</h1>
  <div class="sub">ESTABLISHING SECURE CONNECTION</div>

  <div id="market" class="badge">CHECKING MARKET…</div>

  <div class="bar"><div class="fill"></div></div>
  <div id="count" class="count">Next signal in: 60s</div>

  <div id="signals"></div>

  <button class="btn" onclick="goAssets()">ENTER ASSETS</button>

</div>

<audio id="tone">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-bell-notification-933.mp3">
</audio>

<script>
/* ================= CONFIG ================= */
const pair =
 new URLSearchParams(location.search).get("pair") || "USD_JPY";

/* ================= MARKET TIME (UTC+6) ================= */
function marketOpen(){
 const d=new Date();
 const h=(d.getUTCHours()+6)%24;
 const day=d.getUTCDay();
 if(day===0||day===6) return false;
 return h>=6 && h<=22;
}

/* ================= COUNTDOWN ================= */
let sec=60;
setInterval(()=>{
 sec--;
 if(sec<=0) sec=60;
 document.getElementById("count").innerText =
  "Next signal in: "+sec+"s";
},1000);

/* ================= SIGNAL ENGINE ================= */
async function loadSignal(){
 const box=document.getElementById("signals");
 if(!marketOpen()){
  document.getElementById("market").innerText="MARKET CLOSED";
  box.innerHTML="";
  return;
 }
 document.getElementById("market").innerText="MARKET OPEN";

 try{
  const r=await fetch(
   "https://milongazi197.serv00.net/candle_data.php?instrument="+pair+"&count=30"
  );
  const c=await r.json();
  if(!Array.isArray(c)||c.length<10) throw "no data";

  let up=0,down=0;
  for(let i=c.length-6;i<c.length-1;i++){
   (+c[i].close > +c[i].open)?up++:down++;
  }

  const dir = up>down?"CALL":"PUT";
  const conf = Math.min(92,72+Math.abs(up-down)*5);

  const t=new Date(Date.now()+60000);
  t.setHours(t.getUTCHours()+6);
  const time=t.toTimeString().slice(0,8);

  document.getElementById("tone").play();

  box.innerHTML=`
   <div class="signal ${dir==="PUT"?"put":""}">
    <b>${pair.replace("_"," / ")}</b><br>
    ⏰ ${time} (UTC+6)<br>
    📈 ${dir}<br>
    📊 Accuracy: ${conf}%<br>
    ⚡ Entry: 1 Minute Ahead
   </div>
  `;
 }catch{
  box.innerHTML="";
 }
}

loadSignal();
setInterval(loadSignal,60000);

/* ================= NAV ================= */
function goAssets(){
 location.href="assets.html";
}
</script>

</body>
</html>
