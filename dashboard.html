<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at center,#0a2b22,#020807);
  color:#64ffda;
}
.center{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:20px;
}
.ring{
  width:160px;height:160px;border-radius:50%;
  border:4px solid rgba(100,255,218,.15);
  border-top:4px solid #64ffda;
  animation:spin 2s linear infinite;
  display:flex;align-items:center;justify-content:center;
  margin-top:20px;
}
@keyframes spin{to{transform:rotate(360deg)}}
h1{letter-spacing:2px;margin:20px 0 6px}
.sub{font-size:14px;opacity:.85;margin-bottom:10px}

.badge{
  padding:8px 18px;border-radius:20px;
  background:#00ff99;color:#003;font-weight:bold;
  margin-bottom:12px;
}

.bar{
  width:85%;height:8px;
  background:rgba(255,255,255,.1);
  border-radius:10px;overflow:hidden;
}
.fill{
  height:100%;width:100%;
  background:linear-gradient(90deg,#64ffda,#00c9a7);
}

#countdown{margin:8px 0;font-size:14px}

#signals{
  width:100%;max-width:420px;margin-top:20px;
}
.signal{
  background:#041b15;
  border-left:6px solid #00ffcc;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 0 15px rgba(0,255,200,.25);
}
.signal.call{border-color:#00ff99}
.signal.put{border-color:#ff5555}
.glow{
  animation:glow 1s infinite alternate;
}
@keyframes glow{
  from{box-shadow:0 0 10px #00ffcc}
  to{box-shadow:0 0 25px #00ffcc}
}

.confBar{
  margin-top:6px;height:6px;
  background:rgba(255,255,255,.1);
  border-radius:6px;overflow:hidden;
}
.confFill{
  height:100%;
  background:linear-gradient(90deg,#00ffcc,#00ff99);
}

#newsBox{
  width:100%;max-width:420px;
  margin-top:10px;
  background:#031612;
  border-radius:14px;
  padding:12px;
  box-shadow:0 0 12px rgba(0,255,200,.15);
}
.newsItem{
  font-size:13px;
  border-bottom:1px solid rgba(255,255,255,.1);
  padding:6px 0;
}

.btn{
  margin:25px 0;
  padding:14px 30px;
  background:#ffd000;
  color:#000;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="center">

  <div class="ring">📡</div>

  <h1>APX PREMIUM ENGINE</h1>
  <div id="status" class="sub">ESTABLISHING SECURE CONNECTION</div>

  <div id="marketBadge" class="badge">MARKET OPEN</div>

  <div class="bar"><div class="fill"></div></div>
  <div id="countdown">Next signal in: 60s</div>

  <!-- SIGNALS -->
  <div id="signals"></div>

  <!-- NEWS -->
  <div id="newsBox">
    <b>High Impact News</b>
    <div id="newsList"></div>
  </div>

  <button class="btn" onclick="location.href='assets.html'">ENTER ASSETS</button>

</div>

<audio id="bell">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-bell-notification-933.mp3">
</audio>

<script>
/* ================= CONFIG ================= */
const pair = new URLSearchParams(location.search).get("pair") || "EUR_USD";
const API = "https://liveproxy.mkapi009.workers.dev";

/* ================= ELEMENTS ================= */
const signalsBox = document.getElementById("signals");
const statusBox  = document.getElementById("status");
const newsList   = document.getElementById("newsList");
const bell       = document.getElementById("bell");

/* ================= COUNTDOWN ================= */
let sec = 60;
setInterval(()=>{
  sec--; if(sec<=0) sec=60;
  document.getElementById("countdown").innerText =
    "Next signal in: "+sec+"s";
},1000);

/* ================= SIGNAL ENGINE ================= */
async function loadSignals(){
  try{
    const r = await fetch(API+"/candles?instrument="+pair+"&count=20");
    const j = await r.json();
    const candles = j.data;
    if(!candles || candles.length < 10) throw "no data";

    signalsBox.innerHTML="";
    statusBox.innerText="Market Open • Signals Live";

    let call=0, put=0, vol=0;
    candles.forEach(c=>{
      if(c.direction==="call") call++; else put++;
      vol+=c.volume;
    });

    const trend = call>put ? "CALL":"PUT";
    const baseConf = Math.min(92,80+Math.abs(call-put));

    const last = candles[candles.length-1];
    const [hh,mm] = last.time.split(":").map(Number);

    for(let i=1;i<=5;i++){
      const conf = baseConf-(i-1)*2;
      if(conf<80) continue;

      const m = mm+i;
      const h = (hh+Math.floor(m/60))%24;
      const min = m%60;
      const time =
        String(h).padStart(2,"0")+":"+String(min).padStart(2,"0");

      if(conf>=85) bell.play();

      signalsBox.innerHTML+=`
      <div class="signal ${trend.toLowerCase()} ${conf>=85?'glow':''}">
        <b>${pair}</b><br>
        ⏰ ${time} (UTC+6)<br>
        📈 ${trend} • Confidence ${conf}%<br>
        📊 Avg Volume ${Math.round(vol/candles.length)}
        <div class="confBar">
          <div class="confFill" style="width:${conf}%"></div>
        </div>
      </div>`;
    }
  }catch{
    statusBox.innerText="Signal server unavailable";
  }
}

/* ================= NEWS FILTER ================= */
async function loadNews(){
  try{
    const r = await fetch(API+"/news?pair="+pair);
    const j = await r.json();
    newsList.innerHTML="";
    j.data.forEach(n=>{
      if(n.impact==="high"){
        newsList.innerHTML+=`
          <div class="newsItem">
            🔴 ${n.time} • ${n.title}
          </div>`;
      }
    });
  }catch{
    newsList.innerHTML="<div class='newsItem'>No high impact news</div>";
  }
}

/* ================= START ================= */
loadSignals();
loadNews();
setInterval(loadSignals,60000);
setInterval(loadNews,300000);
</script>
</body>
</html>
