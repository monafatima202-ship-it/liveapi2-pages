<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:radial-gradient(circle at center,#0a2b22,#020807);
  color:#64ffda;
}

/* ================= CENTER ================= */
.center{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* ================= RING ================= */
.ring{
  width:160px;
  height:160px;
  border-radius:50%;
  border:4px solid rgba(100,255,218,.15);
  border-top:4px solid #64ffda;
  animation:spin 2s linear infinite;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

.icon{font-size:36px}

/* ================= TEXT ================= */
h1{
  margin:20px 0 6px;
  letter-spacing:2px;
}

.sub{
  font-size:14px;
  opacity:.85;
  margin-bottom:20px;
}

/* ================= BAR ================= */
.bar{
  width:70%;
  height:8px;
  background:rgba(255,255,255,.1);
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#64ffda,#00c9a7);
}

.percent{
  font-size:13px;
  opacity:.8;
  margin-bottom:20px;
}

/* ================= SIGNAL ================= */
#signals{
  width:90%;
  max-width:420px;
}

.signal{
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  background:#041b15;
  border-left:6px solid #00ffcc;
  box-shadow:0 0 15px rgba(0,255,200,.25);
  text-align:left;
}

.call{border-color:#00ff99}
.put{border-color:#ff5555}

.high{
  animation:glow 1s infinite alternate;
}

@keyframes glow{
  from{box-shadow:0 0 10px #00ffcc}
  to{box-shadow:0 0 25px #00ffcc}
}

/* ================= BUTTON ================= */
.btn{
  margin:30px 0 10px;
  padding:14px 30px;
  background:#ffd000;
  color:#000;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="center">

  <div class="ring">
    <div class="icon">📡</div>
  </div>

  <h1>APX PREMIUM ENGINE</h1>
  <div class="sub" id="status">ESTABLISHING SECURE CONNECTION</div>

  <div class="bar"><div class="fill"></div></div>
  <div class="percent">100%</div>

  <!-- SIGNALS ALWAYS STAY VISIBLE -->
  <div id="signals"></div>

  <button class="btn" onclick="goAssets()">ENTER ASSETS</button>

</div>

<audio id="tone">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-bell-notification-933.mp3">
</audio>

<script>
/* ================= LICENSE CHECK ================= */
const API = "https://live.mkapi009.workers.dev";
const lic = localStorage.getItem("license");

if(!lic){
  location.href="index.html";
}

fetch(API + "/verify?license=" + encodeURIComponent(lic))
.then(r=>r.json())
.then(j=>{
  if(!j.ok){
    localStorage.removeItem("license");
    location.href="index.html";
  }
});

/* ================= PAIR ================= */
const pair =
  new URLSearchParams(location.search).get("pair") || "EUR/USD";

/* ================= SIGNAL RENDER ================= */
function renderSignal(dir, source){
  const box = document.getElementById("signals");

  const future = new Date();
  future.setMinutes(future.getMinutes()+1);

  const conf = Math.floor(80 + Math.random()*15);
  const high = conf>=85;

  if(high) document.getElementById("tone").play();

  box.innerHTML = `
    <div class="signal ${dir.toLowerCase()} ${high?'high':''}">
      <b>${pair}</b><br><br>
      ⏰ Time: ${future.toLocaleTimeString()} (UTC)<br>
      📈 Direction: <b>${dir}</b><br>
      📊 Confidence: ${conf}%<br>
      🧠 Source: ${source}<br>
      ⚡ Entry: 1 Minute Ahead
    </div>
  `;
}

/* ================= LOAD SIGNALS ================= */
async function loadSignals(){
  document.getElementById("status").innerText =
    "🟢 LIVE MARKET • ANALYZING " + pair;

  try{
    const r = await fetch(
      "https://milongazi197.serv00.net/candle_data.php?pair="+pair,
      {cache:"no-store"}
    );

    if(!r.ok) throw "offline";
    const j = await r.json();

    if(j.signals && j.signals.length){
      renderSignal(j.signals[0].dir, "Live Market");
    }else{
      throw "no-signal";
    }

  }catch{
    // 🔥 FALLBACK — UI NEVER BREAKS
    renderSignal(Math.random()>0.5?"CALL":"PUT","AI Fallback");
  }
}

loadSignals();
setInterval(loadSignals,60000);

/* ================= GO ASSETS ================= */
function goAssets(){
  location.href="assets.html";
}
</script>

</body>
</html>
