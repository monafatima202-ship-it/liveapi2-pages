<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at center,#06251f,#020807);
  color:#64ffda;
}

/* ===== CENTER ===== */
.center{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* ===== RING ===== */
.ring{
  width:180px;
  height:180px;
  border-radius:50%;
  border:6px solid rgba(100,255,218,.15);
  border-top:6px solid #64ffda;
  animation:spin 2.5s linear infinite;
  display:flex;
  align-items:center;
  justify-content:center;
}
@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
.icon{font-size:40px}

/* ===== TEXT ===== */
h1{margin:20px 0 6px;letter-spacing:2px}
.sub{font-size:14px;opacity:.85}

/* ===== BADGE ===== */
.badge{
  margin-top:10px;
  padding:6px 14px;
  border-radius:20px;
  font-size:13px;
  background:#0d3;
  color:#003;
}

/* ===== BAR ===== */
.bar{
  width:75%;
  height:8px;
  background:rgba(255,255,255,.1);
  border-radius:10px;
  overflow:hidden;
  margin:12px 0 6px;
}
.fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#64ffda,#00c9a7);
}
.countdown{font-size:14px}

/* ===== SIGNAL CARD ===== */
.signal{
  width:88%;
  margin-top:15px;
  padding:14px;
  border-radius:14px;
  background:#041b15;
  border-left:6px solid #00ffcc;
  box-shadow:0 0 14px rgba(0,255,200,.25);
}
.signal.put{border-color:#ff5c5c}
.signal.glow{
  animation:glow 1s infinite alternate;
}
@keyframes glow{
  from{box-shadow:0 0 12px #00ffcc}
  to{box-shadow:0 0 26px #00ffcc}
}
.tag{font-size:12px;opacity:.85;margin-top:4px}

/* ===== BUTTON ===== */
.btn{
  margin-top:25px;
  padding:14px 34px;
  background:#ffd000;
  color:#000;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="center">

  <div class="ring">
    <div class="icon">📡</div>
  </div>

  <h1>APX PREMIUM ENGINE</h1>
  <div class="sub">ESTABLISHING SECURE CONNECTION</div>

  <div id="market" class="badge">CHECKING MARKET…</div>

  <div class="bar"><div class="fill"></div></div>
  <div id="countdown" class="countdown">Next signal in: 60s</div>

  <div id="signals"></div>

  <button class="btn" onclick="goAssets()">ENTER ASSETS</button>
</div>

<audio id="tone">
 <source src="https://assets.mixkit.co/sfx/preview/mixkit-bell-notification-933.mp3">
</audio>

<script>
/* ===== LICENSE CHECK ===== */
const API="https://live.mkapi009.workers.dev";
const lic=localStorage.getItem("license");
if(!lic) location.href="index.html";

fetch(API+"/verify?license="+encodeURIComponent(lic))
.then(r=>r.json())
.then(j=>{ if(!j.ok){localStorage.removeItem("license");location.href="index.html"} });

/* ===== PAIR ===== */
const pair = new URLSearchParams(location.search).get("pair") || "USD_JPY";

/* ===== MARKET CHECK (FOREX) ===== */
function marketOpen(){
 const d=new Date().getUTCDay();
 return d!==0 && d!==6;
}

/* ===== SIGNAL ENGINE (REAL API) ===== */
let timer=60,lastKey="";

async function loadSignals(){
 try{
 const r=await fetch(
  "https://milongazi197.serv00.net/candle_data.php?instrument="+pair+"&count=20"
 );
 const candles=await r.json();
 if(!Array.isArray(candles)) throw "bad data";

 document.getElementById("market").innerText=
  marketOpen()?"MARKET OPEN":"MARKET CLOSED";

 if(!marketOpen()) return;

 let sigs=[];
 for(let i=candles.length-6;i<candles.length-1;i++){
  const c=candles[i];
  const o=+c.open,cl=+c.close,h=+c.high,l=+c.low;
  const conf=Math.round(Math.abs(cl-o)/(h-l+0.0001)*100);
  if(conf<80) continue;
  sigs.push({dir:cl>o?"CALL":"PUT",conf});
 }

 const box=document.getElementById("signals");
 box.innerHTML="";
 const now=new Date();

 sigs.slice(0,5).forEach((s,i)=>{
  const t=new Date(now.getTime()+(i+1)*60000);
  t.setHours(t.getUTCHours()+6);
  const time=t.toTimeString().slice(0,8);
  const key=time+s.dir;
  if(key!==lastKey){
   document.getElementById("tone").play();
   lastKey=key;
  }
  box.innerHTML+=`
   <div class="signal ${s.dir==="PUT"?"put":""} glow">
    <b>${pair.replace("_"," / ")}</b><br>
    ⏰ ${time} (UTC+6)<br>
    📈 ${s.dir}<br>
    <span class="tag">Accuracy ${s.conf}% • HIGH</span>
   </div>`;
 });
 }catch{
 document.getElementById("signals").innerHTML=
  "<div class='signal put'>Signal server offline</div>";
 }
}

/* ===== COUNTDOWN ===== */
setInterval(()=>{
 timer--;
 if(timer<=0){timer=60;loadSignals()}
 document.getElementById("countdown").innerText=
  "Next signal in: "+timer+"s";
},1000);

loadSignals();

/* ===== NAV ===== */
function goAssets(){location.href="assets.html"}
</script>
</body>
</html>
