<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>APX Premium Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  margin:0;background:radial-gradient(circle,#2b1d0e,#0b0702);
  font-family:Segoe UI;color:#ffd36a;
}
header{
  text-align:center;padding:15px;font-size:20px;font-weight:bold;
}
.notice{
  background:#3b2a12;color:#ffd36a;
  padding:10px;text-align:center;display:none;
}
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:12px;padding:12px;
}
.card{
  background:#120c05;border:1px solid #a77b2e;
  border-radius:14px;padding:14px;
  box-shadow:0 0 12px rgba(255,215,120,.15);
}
.card.new{
  animation:glow 1.2s infinite alternate;
}
@keyframes glow{
  from{box-shadow:0 0 10px #ffd36a}
  to{box-shadow:0 0 30px #ffd36a}
}
.call{color:#00ff9c}
.put{color:#ff4d4d}
.bar{background:#2a1b0c;border-radius:10px;height:8px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#ffd36a,#ffae00)}
footer{
  position:fixed;bottom:0;width:100%;
  background:#120c05;display:flex;justify-content:space-around;
  padding:10px;
}
footer button{
  background:none;border:none;color:#ffd36a;font-size:14px;
}
</style>
</head>
<body>

<header>🚀 APX PREMIUM ENGINE</header>
<div id="expiryNotice" class="notice"></div>
<div id="signals" class="grid"></div>

<footer>
  <button onclick="load()">🔄 Refresh</button>
  <button onclick="logout()">🚪 Exit</button>
</footer>

<audio id="alertSound">
  <source src="alert.mp3" type="audio/mpeg">
</audio>

<script>
const API="https://live.mkapi009.workers.dev/signals";
const box=document.getElementById("signals");
const sound=document.getElementById("alertSound");

let lastHash="";

function nextMinute(t){
  let [h,m]=t.split(":").map(Number);
  m++; if(m===60){m=0;h=(h+1)%24}
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}

function checkExpiry(){
  const exp=localStorage.getItem("expires");
  if(!exp) return;
  const d=Math.ceil((new Date(exp)-new Date())/86400000);
  if(d<=3){
    const n=document.getElementById("expiryNotice");
    n.style.display="block";
    n.innerHTML=`⚠️ License expiring in ${d} days. <a href="renew.html">Renew now</a>`;
  }
}

async function load(){
  const r=await fetch(API);
  const d=await r.json();
  const hash=JSON.stringify(d.signals);

  if(hash!==lastHash && lastHash!==""){
    sound.play(); // AUTO SIGNAL SOUND
  }
  lastHash=hash;

  box.innerHTML="";
  d.signals.forEach(s=>{
    const div=document.createElement("div");
    div.className="card new";
    div.innerHTML=`
      <b>${s.pair}</b><br>
      ENTRY: ${nextMinute(s.time)} | ${s.timeframe}<br>
      <span class="${s.direction==="CALL"?"call":"put"}">${s.direction}</span>
      <div class="bar">
        <div class="fill" style="width:${s.confidence}%"></div>
      </div>
      <small>${s.confidence}% confidence</small>
    `;
    box.appendChild(div);
  });
}

function logout(){
  localStorage.clear();
  location.href="index.html";
}

checkExpiry();
load();
setInterval(load,60000);
</script>
</body>
</html>
