<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:radial-gradient(circle at center,#0a2b22,#020807);
  color:#64ffda;
  overflow:hidden;
}

/* ================= CENTER ================= */
.center{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* ================= RING ================= */
.ring{
  width:160px;
  height:160px;
  border-radius:50%;
  border:4px solid rgba(100,255,218,.15);
  border-top:4px solid #64ffda;
  animation:spin 2s linear infinite;
  display:flex;
  align-items:center;
  justify-content:center;
}

@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

.icon{
  font-size:36px;
}

/* ================= TEXT ================= */
h1{
  margin:25px 0 8px;
  letter-spacing:2px;
}

.sub{
  font-size:14px;
  opacity:.85;
  margin-bottom:25px;
}

/* ================= BAR ================= */
.bar{
  width:70%;
  height:8px;
  background:rgba(255,255,255,.1);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}

.fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#64ffda,#00c9a7);
  animation:load 2s ease-out forwards;
}

@keyframes load{
  from{width:0%}
  to{width:100%}
}

.percent{
  font-size:13px;
  opacity:.8;
}

/* ================= BUTTON ================= */
.btn{
  margin-top:30px;
  padding:14px 30px;
  background:#ffd000;
  color:#000;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="center">

  <div class="ring">
    <div class="icon">📡</div>
  </div>

  <h1>APX PREMIUM ENGINE</h1>
  <div class="sub">ESTABLISHING SECURE CONNECTION</div>

  <div class="bar">
    <div class="fill"></div>
  </div>

  <div class="percent">100%</div>

  <button class="btn" onclick="goAssets()">ENTER ASSETS</button>

</div>

<script>
/* ================= LICENSE CHECK ================= */
const API = "https://live.mkapi009.workers.dev";
const lic = localStorage.getItem("license");

if(!lic){
  location.href="index.html";
}else{
  fetch(API + "/verify?license=" + encodeURIComponent(lic))
    .then(r=>r.json())
    .then(j=>{
      if(!j.ok){
        localStorage.removeItem("license");
        location.href="index.html";
      }
    })
    .catch(()=>{
      alert("Server error");
    });
}

/* ================= GO ASSETS ================= */
function goAssets(){
  location.href="assets.html";
}
</script>

</body>
</html>
