<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;font-family:Arial;
  background:radial-gradient(circle at top,#022,#000);
  color:#7fffe5;
  padding-top:40px;
  transition:background 0.5s;
}
body.lowVol{background:radial-gradient(circle at top,#022,#001)}
body.medVol{background:radial-gradient(circle at top,#2a2a00,#000)}
body.highVol{background:radial-gradient(circle at top,#2a0000,#000)}

.container{max-width:420px;margin:auto;padding:20px;text-align:center}

/* ===== TOP ROLLING BAR ===== */
.topBar{
  position:fixed;
  top:0;left:0;width:100%;
  z-index:9999;
  background:linear-gradient(90deg,#00ffc6,#00a88a);
  color:#001;
  font-size:13px;
  font-weight:bold;
  padding:8px 0;
  overflow:hidden;
}
.topBar span{
  display:inline-block;
  padding-left:100%;
  white-space:nowrap;
  animation:scrollTop 22s linear infinite;
}
@keyframes scrollTop{
  from{transform:translateX(0)}
  to{transform:translateX(-100%)}
}

/* ===== PREMIUM CIRCLE ===== */
.circleWrap{
  width:200px;height:200px;margin:20px auto;
  border-radius:50%;
  position:relative;
  background:
    conic-gradient(
      #00ffc6 var(--fill,0%),
      rgba(0,255,200,.15) 0%
    );
  box-shadow:
    0 0 30px rgba(0,255,200,.8),
    inset 0 0 30px rgba(0,255,200,.5);
  transition:background 0.6s;
}
.rotateOuter{
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:2px dashed rgba(0,255,200,.4);
  animation:spinSlow 12s linear infinite;
}
.rotateInner{
  position:absolute;
  inset:6px;
  border-radius:50%;
  border:2px solid rgba(0,255,200,.25);
  animation:spinFast 3s linear infinite reverse;
}
@keyframes spinSlow{100%{transform:rotate(360deg)}}
@keyframes spinFast{100%{transform:rotate(360deg)}}

.circleInner{
  position:absolute;
  inset:18px;
  background:#001;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  box-shadow:inset 0 0 25px rgba(0,255,200,.6);
}

.apxText{
  font-size:30px;
  font-weight:bold;
  letter-spacing:2px;
  color:#00ffc6;
  text-shadow:
    0 0 10px #00ffc6,
    0 0 25px #00ffc6,
    0 0 40px rgba(0,255,200,.8);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.7}
}

.engineSub{
  font-size:11px;
  opacity:.7;
  letter-spacing:1px;
}

/* ===== SIGNALS ===== */
.signal{
  background:#012;border-radius:14px;padding:12px;margin:10px 0;
  border-left:6px solid #00ffc6;
  box-shadow:0 0 12px rgba(0,255,200,.25);
}
.signal.put{border-color:#ff5c5c}

.confBar{height:6px;background:#044;border-radius:6px;margin-top:6px}
.confFill{height:100%;background:#00ffc6;border-radius:6px}

/* ===== MARKET / NEWS ===== */
.marketBar,.news{
  background:#022;padding:12px;border-radius:14px;margin:12px 0;
  box-shadow:inset 0 0 10px rgba(0,255,200,.2);
}

.graph{
  display:flex;gap:6px;height:80px;align-items:flex-end
}
.graph div{
  flex:1;background:#00ffc6;border-radius:4px;
  box-shadow:0 0 8px rgba(0,255,200,.6);
}

button{
  width:100%;padding:14px;border:none;border-radius:14px;
  background:#ffd000;font-weight:bold;margin-top:14px;
  box-shadow:0 0 15px rgba(255,208,0,.5);
}
</style>
</head>

<body>

<!-- 🔐 LICENSE SAFEGUARD (ADDED – NOTHING REMOVED) -->

<script>
(async function(){
  const API = "https://liveproxy.mkapi009.workers.dev";
  const license = localStorage.getItem("APX_LICENSE");

  if(!license){
    location.replace("license.html");
    return;
  }

  try{
    const r = await fetch(API + "/verify?license=" + encodeURIComponent(license));
    const j = await r.json();

    if(!j.ok){
      alert("Your trial or license has expired");
      localStorage.removeItem("APX_LICENSE");
      location.replace("license.html");
      return;
    }

    // ✅ LICENSE OK → DO NOTHING, PAGE LOAD CONTINUES

  }catch(e){
    alert("License server not reachable");
    location.replace("license.html");
  }
})();
</script>

<div class="topBar">
  <span id="topBarText">Loading market status...</span>
</div>

<div class="container">

  <!-- 🔥 PREMIUM ENGINE CIRCLE -->
  <div class="circleWrap" id="circle">
    <div class="rotateOuter"></div>
    <div class="rotateInner"></div>
    <div class="circleInner">
      <div class="apxText">APX</div>
      <div class="engineSub">PREMIUM ENGINE</div>
    </div>
  </div>

  <h2>APX PREMIUM ENGINE</h2>

  <div id="status" class="marketBar">Connecting…</div>
  <div id="signals"></div>

  <div id="marketBar" class="marketBar">Market condition…</div>
  <div id="graph" class="graph"></div>

  <div id="news" class="news">Loading news…</div>

  <button onclick="location.href='assets.html'">ENTER ASSETS</button>
</div>

<audio id="sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const pair = new URLSearchParams(location.search).get("pair") || "EUR_USD";
const API="https://liveproxy.mkapi009.workers.dev";

const statusBox=document.getElementById("status");
const box=document.getElementById("signals");
const marketBar=document.getElementById("marketBar");
const graph=document.getElementById("graph");
const newsBox=document.getElementById("news");
const sound=document.getElementById("sound");
const circle=document.getElementById("circle");

function t6(ms){
  const d=new Date(ms);
  d.setHours(d.getHours()+6);
  return d.toTimeString().slice(0,5);
}

/* ===== TOP BAR ===== */
function updateTopBar(){
  const now=new Date();
  const utc=new Date(now.getTime()+now.getTimezoneOffset()*60000);
  const day=utc.getUTCDay();
  const h=utc.getUTCHours();
  const m=String(utc.getUTCMinutes()).padStart(2,"0");
  const s=String(utc.getUTCSeconds()).padStart(2,"0");

  let status,session;

  if(day===0||day===6){
    status="🔴 MARKET CLOSED (Weekend)";
    session="Crypto Market Active";
  }else{
    status="🟢 MARKET OPEN";
    if(h<6) session="Asian Session";
    else if(h<13) session="London Session";
    else if(h<20) session="New York Session";
    else session="Late Market";
  }

  document.getElementById("topBarText").innerText =
    `${status} • ${session} • ${utc.toDateString()} • ${h}:${m}:${s} UTC • APX Premium Engine`;
}
updateTopBar();
setInterval(updateTopBar,1000);

/* ===== MAIN ENGINE ===== */
async function load(){
  box.innerHTML="";
  graph.innerHTML="";
  statusBox.innerText="Signals live (API based)";

  const m=await fetch(API+"/market").then(r=>r.json());

  document.body.className="";
  if(m.volatility==="LOW")document.body.classList.add("lowVol");
  if(m.volatility==="MEDIUM")document.body.classList.add("medVol");
  if(m.volatility==="HIGH")document.body.classList.add("highVol");

  marketBar.innerText = m.safe ? "Market SAFE ✅" : "Market RISKY ⚠️";

  let candles=[];
  if(pair.includes("USDT")){
    candles=await fetch(API+"/crypto?symbol="+pair.replace("/",""))
      .then(r=>r.json())
      .then(d=>d.map(c=>({o:+c[1],c:+c[4],t:c[0]})));
  }else{
    candles=await fetch(API+"/candles?instrument="+pair+"&count=20")
      .then(r=>r.json())
      .then(j=>j.data.map(c=>({
        o:c.open,c:c.close,
        t:Date.parse(c.date+"T"+c.time+"Z")
      })));
  }

  let up=0,down=0;
  candles.forEach(c=>c.c>c.o?up++:down++);
  const dir=up>down?"CALL":"PUT";
  const conf=Math.min(95,80+Math.abs(up-down));

  /* 🔥 CONFIDENCE → CIRCLE */
  circle.style.setProperty("--fill", conf+"%");

  if(conf>=88 && m.safe) sound.play();

  [2,5,10,15].forEach((g,i)=>{
    const c=conf-i*2;if(c<80)return;
    box.innerHTML+=`
    <div class="signal ${dir.toLowerCase()}">
      <b>${pair}</b><br>
      ⏰ ${t6(candles.at(-1).t+g*60000)} UTC+6<br>
      📈 ${dir} ${c}%
      <div class="confBar">
        <div class="confFill" style="width:${c}%"></div>
      </div>
    </div>`;
  });

  for(let i=0;i<5;i++){
    const b=document.createElement("div");
    b.style.height=(conf-70+i*2)+"%";
    graph.appendChild(b);
  }

  const news=await fetch(API+"/news").then(r=>r.json());
  newsBox.innerHTML="<b>Market News</b><br>"+
    news.items.map(n=>`${n.time} • ${n.title}`).join("<br>");
}

load();
setInterval(load,60000);
</script>

</body>
</html>
