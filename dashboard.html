<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APX Premium Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top,#022,#000);
  color:#7fffe5;
}

.container{
  max-width:420px;
  margin:auto;
  padding:20px;
  text-align:center;
}

/* ===== CIRCLE ===== */
.circleWrap{
  width:180px;
  height:180px;
  margin:20px auto;
  border-radius:50%;
  border:6px solid rgba(0,255,200,.2);
  position:relative;
}
.circleBar{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:6px solid transparent;
  border-top:6px solid #00ffc6;
  animation:spin 2s linear infinite;
}
@keyframes spin{
  100%{transform:rotate(360deg)}
}

h1{margin:10px 0}

/* ===== STATUS ===== */
.status{
  padding:14px;
  border-radius:14px;
  background:#033;
  margin:10px 0;
}

/* ===== SIGNAL CARD ===== */
.signal{
  background:#012;
  border-left:6px solid #00ffc6;
  border-radius:14px;
  padding:12px;
  margin:12px 0;
  text-align:left;
  box-shadow:0 0 20px rgba(0,255,200,.25);
}
.signal.put{border-color:#ff4d4d}
.signal.call{border-color:#00ffc6}

.confBar{
  height:6px;
  background:#044;
  border-radius:6px;
  margin-top:6px;
}
.confFill{
  height:100%;
  background:linear-gradient(90deg,#00ffc6,#00ff8c);
  border-radius:6px;
}

/* ===== MARKET BAR ===== */
.marketBar{
  margin-top:14px;
  padding:12px;
  border-radius:14px;
  background:#022;
}

/* ===== GRAPH ===== */
.graph{
  height:80px;
  background:#011;
  border-radius:10px;
  margin-top:10px;
  display:flex;
  align-items:flex-end;
  gap:6px;
  padding:6px;
}
.graph div{
  flex:1;
  background:#00ffc6;
  border-radius:4px 4px 0 0;
}

/* ===== NEWS ===== */
.news{
  margin-top:14px;
  background:#2a1d00;
  color:#ffd97a;
  padding:12px;
  border-radius:14px;
}

button{
  margin-top:16px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#ffd000;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="container">

  <!-- CIRCLE NEVER REMOVED -->
  <div class="circleWrap">
    <div class="circleBar"></div>
  </div>

  <h1>APX PREMIUM ENGINE</h1>

  <div id="status" class="status">Connecting…</div>

  <div id="signals"></div>

  <!-- MARKET CONDITION -->
  <div id="marketBar" class="marketBar">
    Market Condition: Analyzing…
  </div>

  <!-- GRAPH -->
  <div id="graph" class="graph"></div>

  <!-- NEWS -->
  <div id="news" class="news">Loading news…</div>

  <button onclick="location.href='assets.html'">ENTER ASSETS</button>

</div>

<!-- SOUND -->
<audio id="alertSound">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<script>
const pair = new URLSearchParams(location.search).get("pair") || "EUR_USD";
const statusBox = document.getElementById("status");
const box = document.getElementById("signals");
const graph = document.getElementById("graph");
const newsBox = document.getElementById("news");
const sound = document.getElementById("alertSound");

/* ===== MARKET OPEN CHECK ===== */
function marketOpen(){
  const d = new Date();
  const day = d.getUTCDay(); // 0 Sun,6 Sat
  return !(day===0 || day===6);
}

/* ===== UTC+6 TIME ===== */
function t6(ms){
  const d=new Date(ms);
  d.setHours(d.getHours()+6);
  return d.toTimeString().slice(0,5);
}

/* ===== LOAD SIGNALS ===== */
async function load(){
  box.innerHTML="";
  graph.innerHTML="";

  if(!marketOpen() && !pair.includes("USDT")){
    statusBox.innerText="Market Closed (Weekend)";
    return;
  }

  statusBox.innerText="Signals live (API based)";

  let candles=[];

  if(pair.includes("USDT")){
    const sym=pair.replace("/","");
    const r=await fetch(
      "https://api.binance.com/api/v3/klines?symbol="+sym+"&interval=1m&limit=20"
    );
    const d=await r.json();
    candles=d.map(c=>({
      o:+c[1],h:+c[2],l:+c[3],c:+c[4],t:c[0]
    }));
  }else{
    const r=await fetch(
      "https://liveproxy.mkapi009.workers.dev/candles?instrument="+pair+"&count=20"
    );
    const j=await r.json();
    candles=j.data.map(c=>({
      o:c.open,h:c.high,l:c.low,c:c.close,
      t:Date.parse(c.date+"T"+c.time+"Z")
    }));
  }

  let up=0,down=0,vol=0;
  candles.forEach(c=>{
    if(c.c>c.o) up++; else down++;
    vol+=Math.abs(c.h-c.l);
  });

  const dir=up>down?"CALL":"PUT";
  const conf=Math.min(92,80+Math.abs(up-down));

  /* SOUND ALERT */
  if(conf>=88) sound.play();

  /* MARKET BAR */
  document.getElementById("marketBar").innerText =
    conf>=85 ? "Market Condition: SAFE ✅" : "Market Condition: RISKY ⚠️";

  /* GRAPH */
  for(let i=0;i<5;i++){
    const b=document.createElement("div");
    b.style.height=(conf-70+i*2)+"%";
    graph.appendChild(b);
  }

  const gaps=[1,2,5,10,15];
  gaps.forEach((g,i)=>{
    const c=conf-i*2;
    if(c<80) return;

    box.innerHTML+=`
    <div class="signal ${dir.toLowerCase()}">
      <b>${pair}</b><br>
      ⏰ ${t6(candles.at(-1).t+g*60000)} (UTC+6)<br>
      📈 ${dir} • Confidence ${c}%
      <div class="confBar">
        <div class="confFill" style="width:${c}%"></div>
      </div>
    </div>`;
  });
}

/* ===== NEWS ===== */
async function loadNews(){
  try{
    const r=await fetch("https://liveproxy.mkapi009.workers.dev/news");
    const j=await r.json();
    if(!j.data || !j.data.length){
      newsBox.innerText="No high impact news";
      return;
    }
    newsBox.innerHTML="<b>High Impact News</b><br>"+
      j.data.map(n=>`⏰ ${n.time} • ${n.title}`).join("<br>");
  }catch{
    newsBox.innerText="No high impact news";
  }
}

load();
loadNews();
setInterval(load,60000);
</script>
</body>
</html>
