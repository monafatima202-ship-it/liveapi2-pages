<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>APX Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  background:#0b0b0b;
  color:#f5d27a;
  font-family:Arial;
}
.box{
  max-width:900px;
  margin:40px auto;
  padding:20px;
  background:#1a1200;
  border-radius:14px;
}
input,select,button{
  padding:10px;
  margin:4px;
}
button{
  background:#ffd000;
  border:none;
  font-weight:bold;
}
table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}
td,th{
  border-bottom:1px solid #444;
  padding:8px;
  text-align:center;
}
</style>
</head>

<body>
<div class="box">
<h2>🔐 APX ADMIN PANEL</h2>

<input id="pass" placeholder="Admin Password">
<button onclick="load()">LOGIN</button>

<table id="tbl" style="display:none">
<thead>
<tr>
<th>License</th>
<th>Plan</th>
<th>Expiry</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>
const API = "https://live.mkapi009.workers.dev";

async function load(){
  const password = pass.value;
  const r = await fetch(API+"/admin/list",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ password })
  });
  const j = await r.json();
  if(!j.ok){ alert("Wrong password"); return; }

  tbl.style.display="table";
  const tb = tbl.querySelector("tbody");
  tb.innerHTML="";

  j.list.forEach(l=>{
    tb.innerHTML+=`
    <tr>
      <td>${l.license}</td>
      <td>${l.plan}</td>
      <td>${new Date(l.expires).toLocaleString()}</td>
      <td>${l.banned?"BANNED":"ACTIVE"}</td>
      <td>
        <button onclick="extend('${l.license}',30)">+30d</button>
        <button onclick="revoke('${l.license}')">BAN</button>
      </td>
    </tr>`;
  });
}

async function extend(license,days){
  await fetch(API+"/admin/extend",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      password:pass.value,
      license, days
    })
  });
  load();
}

async function revoke(license){
  if(!confirm("Ban this license?")) return;
  await fetch(API+"/admin/revoke",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      password:pass.value,
      license
    })
  });
  load();
}
</script>
</body>
</html>
